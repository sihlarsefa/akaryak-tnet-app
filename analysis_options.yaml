# AkaryakıtNet lint ayarları (spec C.1). `bash $W/akn-flutter.sh analyze` temiz kalmalıdır.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Ham `print` yok: debug günlükleri core/utils/log.dart (AppLog) üzerinden gider.
    avoid_print: error
    unawaited_futures: warning

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
    - directives_ordering
    - always_declare_return_types
    - avoid_empty_else
    - cancel_subscriptions
    - prefer_single_quotes
    - unnecessary_await_in_return
    - use_super_parameters
