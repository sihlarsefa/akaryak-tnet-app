name: akaryakitnet
description: "AkaryakıtNet — bayi ve müşteriler için akaryakıt sipariş, teklif ve teslimat uygulaması"
publish_to: 'none'

# version: <ad>+<derleme>. Derleme numarası (iOS CFBundleVersion, Android versionCode) her mağaza
# sürümünde artar; sunucudaki Mobile.MinBuild* / LatestBuild* ayarları bu sayıyla karşılaştırılır.
version: 1.0.0+1

environment:
  sdk: ^3.11.4
  flutter: ">=3.41.6"

# Paket listesi: spec C.2 (aşama 0'da M0a, entegrasyonda A-INT düzenler). Kod üretimi yok (build_runner, freezed,
# json_serializable kullanılmaz); modeller elle yazılır.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Durum, yönlendirme, HTTP
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.9.0

  # Depolama ve çevrimdışı
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  connectivity_plus: ^7.0.0

  # Bildirim (yapılandırma dosyaları yoksa kapalı çalışır)
  firebase_core: 3.15.2
  firebase_messaging: 15.2.10
  flutter_local_notifications: ^22.3.2

  # Hareket
  flutter_animate: ^4.5.2
  animations: ^2.0.11

  # Medya, konum, harita, bağlantılar
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1
  geolocator: ^13.0.4
  google_maps_flutter: ^2.12.3
  url_launcher: ^6.3.2

  # Cihaz
  local_auth: ^3.0.2
  # Biyometrik pencerenin Türkçe metinleri (AndroidAuthMessages / IOSAuthMessages) için doğrudan.
  local_auth_android: ^2.0.8
  local_auth_darwin: ^2.0.5
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.0
  # Uygulama simgesi rozeti (okunmamış bildirim sayısı; çıkışta sıfırlanır). A-INT, spec D.7.
  app_badge_plus: ^1.3.5

  # Belgeler
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^10.1.4
  # PDF seçme ("Dosya (PDF)" yükleme seçeneği; core/media/document_picker.dart). A-INT, spec D.7.
  file_picker: ^11.0.3
  # pdf 3.12 (Dart 3.11 ile uyumlu son sürüm) archive < 4.1 ister; image 4.11.0 ise daha yeni archive
  # API'si (decodeLazy) kullanır ve derlenmez. image 4.10.x ile sınırlı (Flutter yükselince kaldırın).
  image: ">=4.5.4 <4.11.0"

  # Arayüz yardımcıları
  flutter_svg: ^2.0.17
  pinput: ^4.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    # Logo, sembol ve işaret (PDF başlığı, giriş ekranı)
    - assets/brand/
    # PDF belgelerinde Türkçe karakterler için gömülü Roboto (Apache 2.0, bkz. assets/fonts/NOTICE.txt)
    - assets/fonts/
    # Mona Sans lisansı (SIL OFL 1.1); main() içinde LicenseRegistry'ye eklenir.
    - assets/fonts/mona/OFL.txt
  # Arayüz yazı tipi: Mona Sans v2.0.27 (GitHub × Degarism, SIL OFL 1.1), değiştirilmemiş upstream statik
  # TTF'ler (tasarım v2 §3.1). Kelimeler MonaSans, rakamlar MonaSansCondensed. PDF'ler Roboto'da kalır.
  fonts:
    - family: MonaSans
      fonts:
        - asset: assets/fonts/mona/MonaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/mona/MonaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/mona/MonaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/mona/MonaSans-Bold.ttf
          weight: 700
    - family: MonaSansCondensed
      fonts:
        - asset: assets/fonts/mona/MonaSansCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/mona/MonaSansCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/mona/MonaSansCondensed-ExtraBold.ttf
          weight: 800

# Uygulama simgesi: `bash $W/akn-flutter.sh icons`
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app-icon-1024.png"
  remove_alpha_ios: true
  # iOS 18 koyu ve renklendirilmiş simgeler (spec D.7): saydam zeminli » (koyu: logo turuncusu).
  image_path_ios_dark_transparent: "assets/icon/app-icon-dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/app-icon-tinted.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FF5001"
  adaptive_icon_foreground: "assets/icon/app-icon-foreground.png"
  adaptive_icon_monochrome: "assets/icon/app-icon-foreground.png"

# Yerel açılış ekranı (beyaz + turuncu » işareti; koyu temada #16191D gece asfaltı; hiçbir zaman mor değil):
# `bash $W/akn-flutter.sh splash`
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/brand/akn-mark-512.png"
  color_dark: "#16191D"
  image_dark: "assets/brand/akn-mark-512.png"
  ios_content_mode: center
  android_12:
    color: "#FFFFFF"
    image: "assets/icon/app-icon-foreground.png"
    icon_background_color: "#FF5001"
    color_dark: "#16191D"
    image_dark: "assets/icon/app-icon-foreground.png"
    icon_background_color_dark: "#FF5001"
  web: false
